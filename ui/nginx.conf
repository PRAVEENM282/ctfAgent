server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for any client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy the API to the backend `api` service on the compose network.
    # proxy_buffering off keeps Server-Sent Events (the live step timeline) flowing.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location = /health {
        proxy_pass http://api:8080/health;
    }

    location /reports/ {
        proxy_pass http://api:8080;
    }
}
